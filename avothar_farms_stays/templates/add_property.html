{% extends 'base.html' %}
{% block title %}Add Property | Avothar Farms & Stays{% endblock %}
{% block content %}
<section class="section py-5">
  <div class="container">
    <div class="form-panel mx-auto" style="max-width: 900px;">
      <h1>Add New Property</h1>
      <form method="post" enctype="multipart/form-data">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Property Type</label>
            <select class="form-select" name="property_type" required>
              <option value="Villa">Villa</option>
              <option value="Farmhouse">Farmhouse</option>
              <option value="House">Independent House</option>
              <option value="Cottage">Cottage</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Property Name</label>
            <input type="text" class="form-control" name="name" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Location</label>
            <input type="text" class="form-control" name="location" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Price per Night (₹)</label>
            <input type="number" class="form-control" name="price_per_night" min="1" required />
          </div>
          <div class="col-md-4">
            <label class="form-label">Bedrooms</label>
            <input type="number" class="form-control" name="bedrooms" min="1" value="2" required />
          </div>
          <div class="col-md-4">
            <label class="form-label">Guests</label>
            <input type="number" class="form-control" name="guests" min="1" value="4" required />
          </div>
          <div class="col-md-4">
            <label class="form-label">Max Guests</label>
            <input type="number" class="form-control" name="max_guests" min="1" value="6" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Main Image URL</label>
            <input type="url" class="form-control" name="image_url" placeholder="https://example.com/image.jpg" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Upload Main Image</label>
            <input type="file" class="form-control" name="image_file" accept="image/*" />
          </div>
          <div class="col-12">
            <label class="form-label">Gallery Images (one URL per line)</label>
            <textarea class="form-control" name="gallery_images" rows="4" placeholder="https://example.com/1.jpg"></textarea>
          </div>
          <div class="col-12">
            <label class="form-label">Facilities</label>
            <input type="text" class="form-control" name="facilities" placeholder="Wi-Fi, Pool, Parking, Breakfast" required />
          </div>
          <div class="col-12">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" rows="5" required></textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label">Check-in Time</label>
            <input type="time" class="form-control" name="check_in" value="14:00" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Check-out Time</label>
            <input type="time" class="form-control" name="check_out" value="12:00" />
          </div>
          <div class="col-md-6 form-check mt-2">
            <input class="form-check-input" type="checkbox" name="is_available" checked />
            <label class="form-check-label">Available</label>
          </div>
          <div class="col-md-6 form-check mt-2">
            <input class="form-check-input" type="checkbox" name="featured" />
            <label class="form-check-label">Featured</label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary mt-4">Save Property</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
